name: Checkout and notification recovery
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkout-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: vars.RECOVERY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run bounded recovery batch
        env:
          RECOVERY_URL: ${{ vars.RECOVERY_URL }}
          RECOVERY_TOKEN: ${{ secrets.RECOVERY_TOKEN }}
        run: |
          test -n "$RECOVERY_TOKEN"
          curl --fail-with-body --silent --show-error --max-time 90 \
            --request POST --header "Authorization: Bearer $RECOVERY_TOKEN" "$RECOVERY_URL"
