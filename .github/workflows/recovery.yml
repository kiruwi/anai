name: Checkout and notification recovery
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkout-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: vars.RECOVERY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run bounded recovery batch
        env:
          RECOVERY_URL: ${{ vars.RECOVERY_URL }}
          RECOVERY_CONNECT_TO: ${{ vars.RECOVERY_CONNECT_TO }}
          RECOVERY_TOKEN: ${{ secrets.RECOVERY_TOKEN }}
        run: |
          if [ "${#RECOVERY_TOKEN}" -lt 32 ]; then
            echo "::error::RECOVERY_TOKEN must contain at least 32 characters, matching the application's authentication requirement."
            exit 1
          fi
          connection_args=()
          if [ -n "$RECOVERY_CONNECT_TO" ]; then
            # Route this job to the origin while preserving Host, TLS SNI, and certificate checks.
            connection_args=(--connect-to "$RECOVERY_CONNECT_TO")
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            "${connection_args[@]}" \
            --request POST --header "Authorization: Bearer $RECOVERY_TOKEN" "$RECOVERY_URL"
